<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h1>Javascript loop</h1>
        <p id="fruits"></p>

        <script>
            var fruits = ["Apple", "Banana","Mango","Strawberry","Kiwi","Peach"];
            for(var i=0; i<fruits.length;i++){ document.getElementById("fruits") .innerHTML += fruits [i] + "<br>"}
        </script>
    </body>
</html>
