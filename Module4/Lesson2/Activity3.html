<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h1>Javascript Function</h1>
        <p>The sum of two numbers</p>
        <p id="sum"></p>

        <script>
            var result = function (a,b) {
                return a+b;
            }
            document.getElementById("sum")
            .innerHTML = result(5,9)
        </script>
    </body>
</html>
