<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h1></h1>

        <script>
            document.write("<h3>Random set of numbers</h3>");
            for (var i = 0; i < 10; i++) {
                var randomNum = Math.random() * 100;
                document.write(randomNum.toFixed(2) + "<br>")
            }

            document.write("<br>");

            var num = Math.random() * 50;
            document.write("<h3>Single Random Number</h3>");
            document.write("Original Number: " + num + "<br>");
            document.write("Rounded Value: " + Math.round(num) + "<br><br>")

            var today = new Date();
            document.write("<h3>Current date:</h3>");
            document.write(today.toDateString());
        </script>
    </body>
</html>
