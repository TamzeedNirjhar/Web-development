<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h2>Javascript object and array</h2>
        <p id="demo"></p>
        <p id="solar"></p>
        <script>
            //create object
            var star = {
                name: "Sun",
                age: 4.6,
                shape: "round",
                condition: "hot and red",
                person: "humans",
                condition2: "  photosphere, consists mostly of hydrogen (~73%) and helium (~25%), with much smaller quantities of heavier elements, including oxygen, carbon, neon, and iron."

            }
            document.getElementById("demo")
                .innerHTML = "Our planet's name is  " + star.name + " . It is over  " + star.age + " billon years old and It is " + star.shape + " . It has  " + star.condition + "." +   " It is " + star.condition2 

                var solar = ["Mercury", "Venus", "Earth", "Mars", "Jupiter","Saturn","Uranus","Neptune"]


                    //join the elements of array by a separator
                    document.write("<br><br>" + solar.join("*"))

                    //popping an element from the array
                    solar.pop();
                    document.write("<br><br>" + solar)
        </script>
    </body>
</html>
