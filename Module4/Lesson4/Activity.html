<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h2>Javascript Object</h2>
        <p id="demo"></p>

        <script>
            //create object
            var student = {
                name:"Nirjhar",
                age:14,
                class:7,
                fav_sub:"English",

            }
            document.getElementById("demo")
            .innerHTML = "My name is " + student.name+" . Iam "+ student.age+ " years old and I am in class "+ student.class+ " . My favourite subject is "+ student.fav_sub+".";
        </script>
    </body>
</html>
