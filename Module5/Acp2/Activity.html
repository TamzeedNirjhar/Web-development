<!DOCTYPE html>
<html>

<head></head>

<body>
    <h2>Random numbers</h2>
    <p id="number"></p>

    <script>
        let i = 0;
        let text = "";

        while (i < 10) {
            text += "<br>The number is " + i;
            i++;
        }

        document.getElementById("number").innerHTML = text;
    </script>
</body>

</html>
